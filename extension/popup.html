<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightShift</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 200 200" class="moon-svg" aria-hidden="true">
        <defs>
          <radialGradient id="mf" cx="40%" cy="35%" r="65%">
            <stop offset="0%"   stop-color="#fff4a3"/>
            <stop offset="50%"  stop-color="#fcd84b"/>
            <stop offset="100%" stop-color="#e8a800"/>
          </radialGradient>
          <mask id="cm">
            <rect width="200" height="200" fill="white"/>
            <circle cx="126" cy="76" r="58" fill="black"/>
          </mask>
        </defs>
        <circle cx="90" cy="100" r="70" fill="url(#mf)" mask="url(#cm)"/>
      </svg>
      <span class="app-title">NightShift</span>
    </div>
  </div>

  <!-- Current domain -->
  <div class="domain-section">
    <span class="domain-label">Current site</span>
    <span class="domain-name" id="domainName">Loading…</span>
  </div>

  <!-- Toggle -->
  <div class="toggle-section">
    <div class="toggle-info">
      <span class="toggle-title">Dark Mode</span>
      <span class="toggle-subtitle" id="toggleSubtitle">Off</span>
    </div>
    <label class="toggle-switch" aria-label="Toggle dark mode">
      <input type="checkbox" id="darkModeToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Intensity slider (visible only when dark mode is on) -->
  <div class="intensity-section" id="intensitySection" style="display:none">
    <div class="intensity-header">
      <span class="intensity-label">Intensity</span>
      <span class="intensity-value" id="intensityValue">80%</span>
    </div>
    <input type="range" id="intensitySlider" min="40" max="100" step="5" value="80" />
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <span class="stats-text" id="statsText">Loading…</span>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">NightShift v1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
